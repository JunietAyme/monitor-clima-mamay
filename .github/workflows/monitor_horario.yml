name: Monitor Clima Mamay (Horario 24/7)

on:
  workflow_dispatch:

concurrency:
  group: monitor-clima-mamay-prod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extraer-clima:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y Chromium
        run: |
          pip install playwright requests openpyxl
          playwright install chromium

      - name: Ejecutar extracciÃ³n horaria BigFarmNet (con reintentos)
        env:
          TZ: America/Lima
          MAMAY_BFN_USER: ${{ secrets.MAMAY_BFN_USER }}
          MAMAY_BFN_PASS: ${{ secrets.MAMAY_BFN_PASS }}
          MAMAY_BFN_SESSION: ${{ secrets.MAMAY_BFN_SESSION }}
          MAMAY_TG_TOKEN: ${{ secrets.MAMAY_TG_TOKEN }}
          MAMAY_TG_CHAT_ID: ${{ secrets.MAMAY_TG_CHAT_ID }}
        run: python monitor_mamay.py --una-vez

      - name: Validar integridad e historial de datos_clima.js
        run: |
          test -s datos_clima.js
          node --check datos_clima.js
          python -c "import json, subprocess; contar=lambda r: len(json.JSONDecoder().raw_decode(r.split('=',1)[1].lstrip())[0].get('registros',[])); a=contar(open('datos_clima.js',encoding='utf-8').read()); p=contar(subprocess.check_output(['git','show','HEAD:datos_clima.js'],text=True)); print(f'Previos: {p} | Actuales: {a}'); assert a>=int(p*0.85), f'Perdida critica de historial ({a}<{p})'"

      - name: Guardar cambios en GitHub Pages (con reintento ante conflictos)
        env:
          TZ: America/Lima
        run: |
          git config user.name "Monitor Mamay Bot"
          git config user.email "bot@inversionesmamay.local"
          git add datos_clima.js estado_alerta.json ultima_lectura.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Actualizacion horaria 24/7 $(date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Reintentando push ($i/3)..."
              sleep 5
            done
          fi

      - name: Notificar fallo crÃ­tico a Telegram
        if: failure()
        env:
          MAMAY_TG_TOKEN: ${{ secrets.MAMAY_TG_TOKEN }}
          MAMAY_TG_CHAT_ID: ${{ secrets.MAMAY_TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${MAMAY_TG_TOKEN}/sendMessage" \
            -d chat_id="${MAMAY_TG_CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode "text=âš ï¸ <b>FALLO EN MONITOR CLIMA (NUBE 24/7)</b>%0AEl ciclo horario fallÃ³ tras 3 intentos.%0AðŸ” Revisar log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
